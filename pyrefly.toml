project-includes = ["src"]
project-excludes = ["**/.venv/**", "**/__pycache__/**"]
search-path = ["src"]
python-version = "3.12"
preset = "all"
permissive-ignores = false

[errors]
# A RootModel wrapping a primitive is meant to read as the thing it wraps, so
# requiring bool(...) at every call site would defeat the pattern.
implicit-bool = false
