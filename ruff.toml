target-version = "py312"
line-length = 88
src = ["src"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
    "C4",
    "PIE",
    "PT",
    "RET",
    "TID",
    "PTH",
    "ARG",
    "ERA",
    "TRY",
    "PL",
    "A",
    "ASYNC",
    "FBT",
    "ISC",
    "LOG",
    "G",
    "INP",
    "T20",
    "Q",
    "SLF",
    "FURB",
    "PERF",
]
ignore = ["E501"]

[lint.per-file-ignores]
"**/test_*.py" = ["PLR2004"]
# A source model the loader reads is someone else's code, and someone else's code uses
# relative imports. This corpus module is the fixture proving the lift absolutises them.
"**/test_corpus_inheriting.py" = ["TID252"]

[lint.isort]
known-first-party = ["pydantic_codegen"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
docstring-code-format = true
