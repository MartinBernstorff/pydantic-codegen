# pytest's tmp_path fixture is annotated Path, so a Path parameter cannot be wrapped.
allow = ["Path"]

# The corpus stands in for source models written elsewhere, under someone else's rules,
# so it is exempt: a `str` field is one of the shapes it exists to cover.
exclude = ["src/pydantic_codegen/test_corpus_*.py"]

# The recipe surface takes plain str so a recipe reads as prose; each entry point
# wraps its argument on the first line.
[[per_path]]
paths = [
    "src/pydantic_codegen/transformers.py",
    "src/pydantic_codegen/loader.py",
    "src/pydantic_codegen/writing.py",
]
allow = ["str"]
